<VirtualHost *:80>
    ServerName food.eddytester.com

    # HTTP → HTTPS редирект
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    # Если Cloudflare Flexible — заголовок X-Forwarded-Proto
    # Редирект сработает только если запрос пришёл по HTTP напрямую
</VirtualHost>

<VirtualHost *:443>
    ServerName food.eddytester.com

    # Прокси для API v1 (порт 3005)
    ProxyPreserveHost On
    ProxyPass /v1/ http://localhost:3005/v1/
    ProxyPassReverse /v1/ http://localhost:3005/v1/

    # Прокси для API v2 (порт 3006)
    ProxyPass /v2/ http://localhost:3006/v2/
    ProxyPassReverse /v2/ http://localhost:3006/v2/

    # Health check
    ProxyPass /health http://localhost:3005/health
    ProxyPassReverse /health http://localhost:3005/health

    # Swagger UI — v1
    ProxyPass /swagger http://localhost:3005/swagger
    ProxyPassReverse /swagger http://localhost:3005/swagger

    # Swagger JSON
    ProxyPass /swagger.json http://localhost:3005/swagger.json
    ProxyPassReverse /swagger.json http://localhost:3005/swagger.json

    # Корень — редирект на /swagger (или на v1)
    Redirect 302 / /v1/api/stores

    ErrorLog ${APACHE_LOG_DIR}/food-eddytester-error.log
    CustomLog ${APACHE_LOG_DIR}/food-eddytester-access.log combined
</VirtualHost>
